name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 权限最小化
permissions:
  contents: read

env:
  # 保证 CI 中 test/build 真实执行，避免 Turborepo 缓存导致「幽灵通过」。
  TURBO_FORCE: true
  # 固定 Node/pnpm 版本，与 .nvmrc / packageManager 保持一致。
  NODE_VERSION: '26.10.0'
  PNPM_VERSION: '12.8.1'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Help 内容 lint（frontmatter/heading/link/orphan/staleness）
        run: pnpm help:lint

  typecheck:
    name: Typecheck
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Toolchain compatibility contract
        run: pnpm test:toolchain-compat

  test:
    name: Test
    needs: typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare backend env
        # 测试一律用按示例生成的环境文件（本机 SQLite、随机密钥），与个人版导出门禁一致。
        # 不加 --if-missing：检出里即使已有 .env 也覆盖，CI 测试绝不读取任何现成的环境文件（只改 runner 上的检出，不会提交）
        run: node scripts/prepare-backend-env.mjs

      - name: Test
        run: pnpm test

  coverage:
    name: Coverage
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare backend env
        # 测试一律用按示例生成的环境文件（本机 SQLite、随机密钥），与个人版导出门禁一致。
        # 不加 --if-missing：检出里即使已有 .env 也覆盖，CI 测试绝不读取任何现成的环境文件（只改 runner 上的检出，不会提交）
        run: node scripts/prepare-backend-env.mjs

      - name: Backend coverage
        run: pnpm --filter @aiproj/backend run test:coverage

      - name: Frontend coverage
        run: pnpm --filter @aiproj/frontend exec vitest run --coverage

      - name: Aggregate coverage report
        run: pnpm exec tsx scripts/coverage-aggregate.ts

      - name: Upload coverage summary
        uses: actions/upload-artifact@v4
        with:
          name: coverage-summary
          path: coverage/coverage-summary.md

  e2e:
    name: E2E
    needs: coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare backend env
        # 测试一律用按示例生成的环境文件（本机 SQLite、随机密钥），与个人版导出门禁一致。
        # 不加 --if-missing：检出里即使已有 .env 也覆盖，CI 测试绝不读取任何现成的环境文件（只改 runner 上的检出，不会提交）
        run: node scripts/prepare-backend-env.mjs

      - name: Install Playwright browsers
        run: pnpm --filter @aiproj/e2e exec playwright install --with-deps

      - name: E2E
        run: pnpm test:e2e

  build:
    name: Build
    needs: e2e
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
