# =============================================================================
# 开项 KaiPilot —— 默认完整栈（PostgreSQL + Redis）
# （v3-docker-compose-runtime-foundation, design D1/D2/D5/D7）
#
# 目标 Docker 主机唯一入口：
#   docker compose up -d --build
# 无需复制/编辑任何 tracked 文件；可选覆盖见 .env.compose.example（gitignored .env.compose）。
#
# 启动顺序（fail closed）：
#   init-config(一次性) → postgres healthy → migrate(一次性, exit 0)
#   backend 依赖 migrate 完成 + redis healthy；frontend 依赖 backend healthy；
#   edge 依赖 frontend/backend healthy。只有 edge 发布单一宿主端口。
# =============================================================================

services:
  # --- 一次性：runtime-secret 初始化（唯一允许 root 的 job，完成后退出） ---
  init-config:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    image: aiproj-backend:local
    user: '0:0'
    command: ['init-config']
    environment:
      AIPROJ_INIT_POSTGRES: 'true'
      # 自带 secret 覆盖（可选，见 .env.compose.example）；空值 = 自动生成
      AIPROJ_APP_KEY: ${AIPROJ_APP_KEY:-}
      AIPROJ_JWT_ACCESS_SECRET: ${AIPROJ_JWT_ACCESS_SECRET:-}
      AIPROJ_POSTGRES_PASSWORD: ${AIPROJ_POSTGRES_PASSWORD:-}
    volumes:
      - runtime-secrets:/run/aiproj-secrets
      - storage:/app/storage
    networks:
      - aiproj
    restart: 'no'

  # --- PostgreSQL（固定 major，password-file，具名 volume 持久化） ---
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${AIPROJ_POSTGRES_DB:-aiproj}
      POSTGRES_USER: ${AIPROJ_POSTGRES_USER:-aiproj}
      # 密码只经 runtime-secret volume 文件传递，不出现在 compose config 展开结果中
      POSTGRES_PASSWORD_FILE: /run/aiproj-secrets/pg_password
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - runtime-secrets:/run/aiproj-secrets:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    networks:
      - aiproj
    restart: unless-stopped
    depends_on:
      init-config:
        condition: service_completed_successfully

  # --- 单节点 Redis（固定 major，AOF 持久化；不引入 Cluster/Sentinel） ---
  redis:
    image: redis:8.10-alpine
    command: ['redis-server', '--appendonly', 'yes', '--appendfsync', 'everysec']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 3s
    networks:
      - aiproj
    restart: unless-stopped

  # --- 一次性：Lucid migrations（复用仓库既有迁移目录；失败即非零退出） ---
  migrate:
    image: aiproj-backend:local
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    user: '10001:10001'
    command: ['migrate']
    environment:
      TZ: UTC
      NODE_ENV: production
      LOG_LEVEL: info
      PORT: '3333'
      HOST: 0.0.0.0
      # 仅影响可选外部回调推导（OAuth/SSO 等授权门能力）；同源 UI/API/WS 不依赖它
      APP_URL: ${AIPROJ_PUBLIC_ORIGIN:-http://localhost}
      FRONTEND_URL: ${AIPROJ_PUBLIC_ORIGIN:-http://localhost}
      SESSION_DRIVER: cookie
      DB_CONNECTION: pg
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_USER: ${AIPROJ_POSTGRES_USER:-aiproj}
      DB_DATABASE: ${AIPROJ_POSTGRES_DB:-aiproj}
      DB_POOL_MIN: '2'
      DB_POOL_MAX: '10'
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 8h
      LIMITER_STORE: redis
      REDIS_ENABLED: 'true'
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      REDIS_DB: ${AIPROJ_REDIS_DB:-0}
      AIPROJ_APP_KEY: ${AIPROJ_APP_KEY:-}
      AIPROJ_JWT_ACCESS_SECRET: ${AIPROJ_JWT_ACCESS_SECRET:-}
      AIPROJ_POSTGRES_PASSWORD: ${AIPROJ_POSTGRES_PASSWORD:-}
    volumes:
      - runtime-secrets:/run/aiproj-secrets:ro
    networks:
      - aiproj
    restart: 'no'
    depends_on:
      init-config:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # --- 后端 API + Socket.IO（非 root，network-only） ---
  backend:
    image: aiproj-backend:local
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    user: '10001:10001'
    command: ['serve']
    environment:
      TZ: UTC
      NODE_ENV: production
      LOG_LEVEL: info
      PORT: '3333'
      HOST: 0.0.0.0
      APP_URL: ${AIPROJ_PUBLIC_ORIGIN:-http://localhost}
      FRONTEND_URL: ${AIPROJ_PUBLIC_ORIGIN:-http://localhost}
      SESSION_DRIVER: cookie
      DB_CONNECTION: pg
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_USER: ${AIPROJ_POSTGRES_USER:-aiproj}
      DB_DATABASE: ${AIPROJ_POSTGRES_DB:-aiproj}
      DB_POOL_MIN: '2'
      DB_POOL_MAX: '10'
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 8h
      LIMITER_STORE: redis
      REDIS_ENABLED: 'true'
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      REDIS_DB: ${AIPROJ_REDIS_DB:-0}
      UPLOAD_ROOT: /app/storage/uploads
      AI_DSH_IDENTITY_PATH: /app/storage/secrets/dsh-anonymous-user-id
      # 慢推理模型可能在首个答案 token 前保持静默；Docker 默认值与本机代码一致。
      AI_M0_REQUEST_TIMEOUT_MS: ${AI_M0_REQUEST_TIMEOUT_MS:-3000000}
      AI_ADAPTIVE_CLARIFICATION_ATTEMPT_TIMEOUT_MS: ${AI_ADAPTIVE_CLARIFICATION_ATTEMPT_TIMEOUT_MS:-1200000}
      AI_ADAPTIVE_CLARIFICATION_ROUND_TIMEOUT_MS: ${AI_ADAPTIVE_CLARIFICATION_ROUND_TIMEOUT_MS:-1500000}
      AI_DRAFT_TIME_BUDGET_SCALE: ${AI_DRAFT_TIME_BUDGET_SCALE:-5}
      AI_DRAFT_OUTPUT_BUDGET_SCALE: ${AI_DRAFT_OUTPUT_BUDGET_SCALE:-5}
      # 矛盾求解（TRIZ）真实模型开关：未传入时容器内看不到该变量；显式写出便于在 .env.compose 关闭
      AIPROJ_TRIZ_ENABLE_REAL_AI: ${AIPROJ_TRIZ_ENABLE_REAL_AI:-true}
      # Google 登录（可选）：设置 AIPROJ_GOOGLE_OAUTH_SECRET_FILE 后才启用（见 .env.compose.example）；
      # 没有设置时只挂占位文件、不传 JSON 路径，登录页的 Google 按钮显示「未配置」。
      GOOGLE_OAUTH_CLIENT_JSON_PATH: ${AIPROJ_GOOGLE_OAUTH_SECRET_FILE:+/run/secrets/google-oauth-client.json}
      GOOGLE_OAUTH_REDIRECT_URI: ${AIPROJ_GOOGLE_OAUTH_ORIGIN:-http://localhost}/api/v1/auth/google/callback
      GOOGLE_AUTH_SUCCESS_REDIRECT_URL: ${AIPROJ_GOOGLE_OAUTH_ORIGIN:-http://localhost}/auth/google/callback
      GOOGLE_AUTH_FAILURE_REDIRECT_URL: ${AIPROJ_GOOGLE_OAUTH_ORIGIN:-http://localhost}/login
      AIPROJ_APP_KEY: ${AIPROJ_APP_KEY:-}
      AIPROJ_JWT_ACCESS_SECRET: ${AIPROJ_JWT_ACCESS_SECRET:-}
      AIPROJ_POSTGRES_PASSWORD: ${AIPROJ_POSTGRES_PASSWORD:-}
    volumes:
      - runtime-secrets:/run/aiproj-secrets:ro
      - storage:/app/storage
    secrets:
      - source: google-oauth-client
        target: google-oauth-client.json
    healthcheck:
      test: ['CMD', 'node', '/app/docker/healthcheck.mjs']
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 20s
    networks:
      - aiproj
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # --- 前端 standalone（非 root，network-only，相对同源 /api/v1 构建期固化） ---
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        # 新 UI 组织级灰度门控（构建期内联，改值需 --build）；见 .env.compose.example
        NEXT_PUBLIC_FF_NEXT_UI: ${AIPROJ_FF_NEXT_UI:-true}
        NEXT_PUBLIC_FF_NEXT_UI_ORGS: ${AIPROJ_FF_NEXT_UI_ORGS:-}
        # 「源代码」链接地址（AGPL 第 13 条，构建期内联）；留空不显示
        NEXT_PUBLIC_AIPROJ_SOURCE_URL: ${AIPROJ_SOURCE_URL:-https://github.com/scopeharbor/KaiPilot}
    image: aiproj-frontend:local
    healthcheck:
      test: ['CMD', 'node', '/app/docker/healthcheck.mjs']
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 15s
    networks:
      - aiproj
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

  # --- 同源 edge（唯一发布宿主端口的组件；非特权 nginx） ---
  edge:
    image: nginxinc/nginx-unprivileged:1.31-alpine
    ports:
      - '${AIPROJ_BIND_ADDRESS:-0.0.0.0}:${AIPROJ_HTTP_PORT:-80}:8080'
    volumes:
      - ./edge/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      # 同时验证 UI 与代理后的 /api/v1/health/live（同一公开 origin）
      test:
        [
          'CMD-SHELL',
          'wget -qO- http://127.0.0.1:8080/api/v1/health/live >/dev/null 2>&1 && wget -qO- http://127.0.0.1:8080/ >/dev/null 2>&1',
        ]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 10s
    networks:
      - aiproj
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy

volumes:
  runtime-secrets:
  pgdata:
  redis-data:
  storage:

secrets:
  google-oauth-client:
    file: ${AIPROJ_GOOGLE_OAUTH_SECRET_FILE:-./fixtures/google-oauth/unconfigured.json}

networks:
  aiproj:
    driver: bridge
