# =============================================================================
# 开项 OpenXiang —— 同源 edge proxy（v3-docker-compose-runtime-foundation, design D4）
#
# 唯一对外组件：浏览器只访问本服务的一个公开端口。
#   /api/v1/*   → 内部 backend（REST + SSE 流式）
#   /socket.io/* → 内部 backend（Socket.IO WebSocket upgrade + polling fallback）
#   其余         → 内部 frontend（Next.js standalone）
#
# 非特权运行：配合 nginxinc/nginx-unprivileged 镜像（容器内监听 8080，不以 root 绑定）。
# 内部 DNS 名（backend/frontend）只出现在本配置内，不出现在任何浏览器可见响应中
# （proxy_set_header Host $host 保持原始 Host；proxy_redirect 关闭，不做地址重写）。
# =============================================================================

map $http_upgrade $aiproj_connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 8080;
  server_name _;

  # 附件上传/报表导出走 multipart，上限对齐后端 bodyparser 限制
  client_max_body_size 25m;

  # --- REST API + SSE ---
  location /api/v1/ {
    proxy_pass http://backend:3333;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Google OAuth 成功回调的 Location 含系统 access/refresh token 与用户投影；
    # org_admin 权限 JWT 会令响应头超过 Nginx 默认单页 4K/8K 缓冲，默认值会被判 invalid 并返回 502。
    proxy_buffer_size 32k;
    # Nginx 启动校验要求 busy buffer >= 单个 buffer，且 < buffers 总量减一个 buffer。
    proxy_buffers 8 32k;
    proxy_busy_buffers_size 64k;
    # SSE 流式响应：关闭代理缓冲，长连接不断流
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 300s;
    proxy_connect_timeout 30s;
    proxy_redirect off;
  }

  # --- Socket.IO（WebSocket upgrade，自动降级 polling） ---
  location /socket.io/ {
    proxy_pass http://backend:3333;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $aiproj_connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_connect_timeout 30s;
    proxy_redirect off;
  }

  # --- 前端 UI（含 Next.js 静态资源） ---
  location / {
    proxy_pass http://frontend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_connect_timeout 30s;
    proxy_redirect off;
  }
}
