packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  better-sqlite3: true
  '@napi-rs/canvas': true
  esbuild: true
  sharp: true
  '@studyzy/openspec-cn': false
  '@swc/core': false
  canvas: false

# TypeScript 7 的 `typescript` 包不再导出经典编译器 API；仍依赖该 API 的工具由
# .pnpmfile.cjs 改接官方过渡包 @typescript/typescript6。@adonisjs/assembler 只 spawn
# `tsc` 可执行文件（类型声明仅 type-only 引用），已实测兼容 TS 7。
minimumReleaseAgeExclude:
  - '@next/env@16.3.7'
  - '@next/swc-darwin-arm64@16.3.7'
  - '@next/swc-darwin-x64@16.3.7'
  - '@next/swc-linux-arm64-gnu@16.3.7'
  - '@next/swc-linux-arm64-musl@16.3.7'
  - '@next/swc-linux-x64-gnu@16.3.7'
  - '@next/swc-linux-x64-musl@16.3.7'
  - '@next/swc-win32-arm64-msvc@16.3.7'
  - '@next/swc-win32-x64-msvc@16.3.7'
  - next@16.3.7

peerDependencyRules:
  allowedVersions:
    '@adonisjs/assembler>typescript': '7'
